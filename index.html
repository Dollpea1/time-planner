<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <h1>Time Planner</h1>
        <div class="task-counter-badge" id="task-counter-badge" aria-live="polite">
          <span class="badge-label">Total Tasks:</span>
          <span class="badge-count" id="total-count">0</span>
        </div>
      </div>
      <p class="tagline">Organize your schedule simply and clearly.</p>
    </header>

    <!-- Main Content -->
    <main>
      <!-- Add Task Form Card -->
      <section class="card form-card" aria-labelledby="form-heading">
        <h2 id="form-heading">Add a New Task</h2>
        <form id="add-task-form" novalidate>
          <div class="form-group">
            <label for="task-name">Task Name</label>
            <input 
              type="text" 
              id="task-name" 
              placeholder="e.g., Team meeting, Gym workout" 
              required 
              autocomplete="off"
            >
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="task-date">Date</label>
              <input type="date" id="task-date" required>
            </div>
            <div class="form-group">
              <label for="task-time">Time</label>
              <input type="time" id="task-time" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="task-status">Status</label>
              <select id="task-status" required>
                <option value="Pending" selected>Pending</option>
                <option value="Done">Done</option>
              </select>
            </div>
            <div class="form-group">
              <label for="task-category">Category</label>
              <select id="task-category" required>
                <option value="Work">Work</option>
                <option value="Personal" selected>Personal</option>
                <option value="Study">Study</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" id="add-btn">
            <svg class="icon" viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
              <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
            </svg>
            Add Task
          </button>
        </form>
      </section>

      <!-- Task List Section -->
      <section class="card list-card" aria-labelledby="list-heading">
        <div class="list-header">
          <h2 id="list-heading">Your Tasks</h2>
          <!-- Search Bar -->
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor" width="16" height="16" aria-hidden="true">
              <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
            </svg>
            <input 
              type="search" 
              id="search-input" 
              placeholder="Search by name, category, status, date..." 
              aria-label="Search tasks"
            >
          </div>
        </div>

        <!-- Task List Container -->
        <ul id="task-list" class="task-list" aria-label="Task list"></ul>

        <!-- Empty State Message -->
        <div id="empty-state" class="empty-state" style="display: none;">
          <div class="empty-icon">🗓️</div>
          <h3 id="empty-title">No tasks planned yet!</h3>
          <p id="empty-subtitle">Fill in the task details above and click "Add Task" to get started.</p>
        </div>
      </section>
    </main>
  </div>

  <!-- Edit Task Modal -->
  <div id="edit-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="edit-modal-title">Edit Task</h2>
        <button type="button" class="close-btn" id="modal-close-btn" aria-label="Close dialog">&times;</button>
      </div>
      <form id="edit-task-form" novalidate>
        <input type="hidden" id="edit-task-id">

        <div class="form-group">
          <label for="edit-task-name">Task Name</label>
          <input type="text" id="edit-task-name" required autocomplete="off">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="edit-task-date">Date</label>
            <input type="date" id="edit-task-date" required>
          </div>
          <div class="form-group">
            <label for="edit-task-time">Time</label>
            <input type="time" id="edit-task-time" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="edit-task-status">Status</label>
            <select id="edit-task-status" required>
              <option value="Pending">Pending</option>
              <option value="Done">Done</option>
            </select>
          </div>
          <div class="form-group">
            <label for="edit-task-category">Category</label>
            <select id="edit-task-category" required>
              <option value="Work">Work</option>
              <option value="Personal">Personal</option>
              <option value="Study">Study</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="edit-cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="edit-save-btn">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
